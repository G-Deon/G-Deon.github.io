<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Analisador Léxico — AFD</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Iosevka+Charon:wght@400;500;700&family=Roboto+Mono:ital,wght@0,100..700;1,100..700&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
    <script src="script.js" defer></script>
  </head>
  <body>
    <div id="app">
      <div id="header">
        <h2>Analisador Léxico</h2>
      </div>
      <div class="section-label">Adicionar palavra ao autômato</div>
      <div class="row">
        <input
          type="text"
          id="wordInput"
          placeholder="Digite uma palavra para adicionar ao autômato"
          autocomplete="off"
          spellcheck="false"
        />
        <button onclick="addWord()">Adicionar</button>
        <button onclick="resetAll()">Reiniciar</button>
      </div>
      <div class="err-msg" id="errMsg"></div>
      <div class="word-chips" id="wordChips"></div>

      <hr />

      <div class="section-label" style="margin-top: 0.75rem">
        Analisar token
      </div>
      <div class="row">
        <input
          type="text"
          id="lexInput"
          placeholder="Digite e pressione espaço para reconhecer"
          autocomplete="off"
          spellcheck="false"
        />
        <div class="result-box" id="resultBox">aguardando</div>
      </div>
      <div class="tokens-list" id="tokensList"></div>
    </div>
    <div class="table-wrap" hidden>
      <table id="afdTable"></table>
    </div>
  </body>
</html>
